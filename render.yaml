# Render Blueprint — provisions the database, web service and env wiring automatically.
# Connect this repo in Render and apply the blueprint; only GEMINI_API_KEY (optional) is left to fill in.
# APP_URL / PUBLIC_URL are derived at runtime from RENDER_EXTERNAL_URL; PORT is injected by Render.
databases:
  - name: sitebuilder-db
    databaseName: sitebuilder
    user: sitebuilder
    plan: free

services:
  - type: web
    name: sitebuilder-x-ultra
    runtime: node
    plan: free
    # NODE_ENV=production is set below, which makes npm skip devDependencies by default;
    # --include=dev keeps vite/tsup/typescript available for the build step.
    buildCommand: npm install --include=dev && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: sitebuilder-db
          property: connectionString
      - key: GEMINI_MODEL
        value: gemini-3.5-flash
      - key: GEMINI_API_KEY
        sync: false
      # Optional outbound email for password recovery:
      - key: SMTP_HOST
        sync: false
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASSWORD
        sync: false
      - key: SMTP_FROM
        sync: false
    # Uploads live on the instance filesystem. On the free plan this is ephemeral;
    # when you upgrade to a paid instance, attach a persistent disk:
    # disk:
    #   name: uploads
    #   mountPath: /opt/render/project/src/apps/server/storage/uploads
    #   sizeGB: 1